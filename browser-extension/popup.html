<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>UniHub</title>

    <style>
      body {
        width: 330px;
        margin: 0;
        padding: 18px;
        color: #15283a;
        background: #f3f7fa;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }

      p {
        color: #647789;
        font-size: 13px;
        line-height: 1.5;
      }

      .actions {
        display: grid;
        gap: 9px;
      }

      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #315f89;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        color: #315f89;
        background: #dfeaf3;
      }

      button.danger {
        color: #a12620;
        background: #f7dfdd;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #result,
      #crawl-status {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        background: white;
        font-size: 13px;
        line-height: 1.6;
      }

      #crawl-status strong,
      #crawl-status small {
        display: block;
      }

      #crawl-status small {
        margin-top: 4px;
        color: #647789;
      }

      .progress {
        height: 7px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 99px;
        background: #dce5ec;
      }

      .progress > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #2f7d59;
        transition: width 180ms ease;
      }

      .error {
        color: #b42318;
      }

      .success {
        color: #21734c;
      }
    </style>
  </head>

  <body>
    <h1>UniHub</h1>

    <p>
      Übernimmt einzelne Seiten oder durchsucht
      einen gesamten ILIAS-Kurs rekursiv.
    </p>

    <div class="actions">
      <button id="scan">
        Aktuelle Seite scannen
      </button>

      <button
        id="crawl"
        class="secondary"
      >
        Gesamten Kurs scannen
      </button>

      <button
        id="stop"
        class="danger"
        hidden
      >
        Scan stoppen
      </button>
    </div>

    <div id="result">
      Noch nicht gescannt.
    </div>

    <div id="crawl-status">
      Kein automatischer Scan aktiv.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
